<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NEURAL KIT — Personal Intelligence System</title>
<style>
:root{--bg:#070707;--fg:#f4f2eb;--mut:#8b8c87}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:4;left:18px;right:18px;top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;pointer-events:none}.k{font-size:10px;letter-spacing:.23em;color:var(--mut);text-transform:uppercase}.title{font-size:18px;margin-top:6px;letter-spacing:-.03em}.goal{text-align:right;font-size:11px}.goal span{display:block;color:var(--mut);margin-top:4px}.chips{position:fixed;z-index:4;left:18px;top:86px;display:flex;gap:6px;flex-wrap:wrap;max-width:80vw}.chip{padding:6px 8px;border:1px solid rgba(255,255,255,.07);border-radius:999px;font-size:9px;color:#b9bab6;background:rgba(0,0,0,.22);backdrop-filter:blur(10px)}.composerWrap{position:fixed;z-index:7;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center}.composer{width:min(760px,100%);border:1px solid rgba(255,255,255,.09);background:rgba(14,14,14,.86);backdrop-filter:blur(22px);border-radius:22px;padding:10px;box-shadow:0 22px 90px rgba(0,0,0,.55)}.row{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:56px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;line-height:1.4;padding:12px}textarea::placeholder{color:#666864}.mic,.send{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}.mic{background:#191919;color:#fff;border:1px solid rgba(255,255,255,.08)}.mic.on{background:#efede6;color:#060606;box-shadow:0 0 0 7px rgba(255,255,255,.05)}.send{background:#efede6;color:#060606}.meta{display:flex;justify-content:space-between;gap:10px;padding:4px 8px 1px;color:var(--mut);font-size:10px}.logbtn{position:fixed;z-index:8;right:18px;top:82px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#d8d8d3;border-radius:999px;padding:7px 10px;font-size:9px}.drawer{position:fixed;z-index:9;right:14px;top:124px;width:min(330px,calc(100vw - 28px));max-height:54vh;overflow:auto;padding:12px;border:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.88);backdrop-filter:blur(22px);border-radius:18px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.2s}.drawer.open{opacity:1;transform:none;pointer-events:auto}.drawer h2{font-size:10px;letter-spacing:.17em;color:var(--mut);font-weight:500;text-transform:uppercase}.ev{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}.ev .t{font-size:12px;line-height:1.35}.ev .s{margin-top:5px;color:var(--mut);font-size:9px;text-transform:uppercase;letter-spacing:.07em}.centerHint{position:fixed;z-index:2;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:.48}.centerHint b{display:block;font-weight:500;font-size:12px}.centerHint span{font-size:10px;color:var(--mut)}.nodecard{position:fixed;z-index:6;min-width:170px;max-width:240px;padding:10px 12px;border:1px solid rgba(255,255,255,.10);background:rgba(12,12,12,.82);backdrop-filter:blur(18px);border-radius:14px;opacity:0;transform:translate(-50%,-50%) scale(.94);pointer-events:none;transition:.18s ease}.nodecard.open{opacity:1;transform:translate(-50%,-50%) scale(1)}.nodecard b{display:block;font-size:11px;font-weight:560}.nodecard span{display:block;font-size:9px;color:var(--mut);margin-top:4px;line-height:1.35}@media(max-width:620px){.goal{display:none}.logbtn{top:48px}.drawer{top:86px}.chips{top:83px;max-width:92vw}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div><div class="k">Personal Intelligence System</div><div class="title">NEURAL KIT</div></div><div class="goal"><b>$500K / 100 DÍAS</b><span>medir avance, no actividad</span></div></div>
<div class="chips"><span class="chip">VENTAS</span><span class="chip">BRAVA</span><span class="chip">THINK</span><span class="chip">GALA × BRAVA</span><span class="chip">ACTIVOS</span><span class="chip">CUERPO</span><span class="chip">MENTE</span><span class="chip">ESPÍRITU</span></div>
<button id="logBtn" class="logbtn">REGISTRO</button><aside id="drawer" class="drawer"><h2>Últimos movimientos</h2><div id="events"></div></aside>
<div id="nodecard" class="nodecard"><b id="cardTitle"></b><span id="cardText"></span></div>
<div id="hint" class="centerHint"><b>Tu sistema empieza contigo.</b><span>Habla o escribe. La red se reorganiza.</span></div>
<div class="composerWrap"><div class="composer"><div class="row"><button id="mic" class="mic" aria-label="Dictar">◉</button><textarea id="note" placeholder="¿Qué pasó hoy? Ej. ‘Visité a un cliente para ofrecer murales y le interesó…’"></textarea><button id="send" class="send" aria-label="Guardar">→</button></div><div class="meta"><span id="route">Listo para capturar.</span><span>MVP LOCAL</span></div></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1,t=0,m={x:W/2,y:H/2},selected=null,hit=[];
const N=[
['LEON','LEÓN','.50','.45',7,'core'],['BRAVA','BRAVA','.30','.34',5,'biz','LEON'],['THINK','THINK','.69','.34',5,'biz','LEON'],['GALA','GALA × BRAVA','.72','.53',4,'biz','LEON'],
['MAGBAY','Magbay Seafaris','.16','.25',3,'biz','BRAVA'],['MEXWORK','Mexwork','.16','.38',3,'biz','BRAVA'],['SABINO','Sabino y Villagómez','.23','.49',3,'biz','BRAVA'],['BARBA','Barba Azul','.36','.52',3,'biz','BRAVA'],['TILIA','Tilia Café · prospecto','.09','.49',3,'pros','BRAVA'],
['UP','UP','.82','.24',3,'biz','THINK'],['BEE','Bee Tierra · prospecto','.86','.37',3,'pros','THINK'],['AMASA','Amasa · prospecto','.82','.46',3,'pros','THINK'],['AINSA','Ainsa','.86','.59',3,'biz','GALA'],
['ACTIVOS','ACTIVOS','.34','.68',5,'pers','LEON'],['BLACK','Black Royal','.18','.70',4,'pers','ACTIVOS'],['ROULETTE','Roulette','.08','.78',2.5,'pers','BLACK'],['DEPORTIVO','Deportivo','.20','.83',2.5,'pers','BLACK'],['QUIZ','Quiz','.35','.83',3,'pers','ACTIVOS'],['BRUSHES','Brushes','.46','.79',3,'pers','ACTIVOS'],
['MURALES','MURALES','.60','.72',5,'pers','LEON'],['THOROART','THORO Calavera Art','.70','.82',3,'pers','MURALES'],['THOROFOTO','THORO Calavera Foto','.82','.73',3,'pers','MURALES'],
['CUERPO','CUERPO','.49','.17',4,'pers','LEON'],['HYROX','HYROX Cancún','.59','.08',3,'pers','CUERPO'],['NUTRI','Nutrición','.42','.07',2.6,'pers','CUERPO'],['MENTE','MENTE','.30','.12',4,'pers','LEON'],['LIBROS','Libros','.18','.11',2.6,'pers','MENTE'],['ESP','ESPÍRITU','.69','.13',4,'pers','LEON'],['MEDITA','Meditación','.80','.10',2.6,'pers','ESP']
].map((a,i)=>({id:a[0],label:a[1],x:+a[2],y:+a[3],r:+a[4],g:a[5],p:a[6],phase:i*.77,amp:.006+Math.random()*.009,speed:.22+Math.random()*.18,depth:.75+Math.random()*.5}));let L=N.filter(n=>n.p).map(n=>[n.p,n.id]);
function node(id){return N.find(n=>n.id===id)}function pos(n){let orbit=t*n.speed+n.phase;let dx=Math.sin(orbit*1.13)*n.amp+Math.cos(orbit*.61+n.phase)*n.amp*.55;let dy=Math.cos(orbit*.93)*n.amp+Math.sin(orbit*.53+n.phase)*n.amp*.5;return{x:(n.x+dx)*W,y:(n.y+dy)*H}}function rs(){W=innerWidth;H=innerHeight;D=devicePixelRatio||1;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);addEventListener('pointermove',e=>m={x:e.clientX,y:e.clientY});
function draw(){t+=.014;X.clearRect(0,0,W,H);hit=[];for(const[a,b]of L){let A=pos(node(a)),B=pos(node(b)),q=(Math.sin(t*1.7+B.x*.006)+1)/2;X.strokeStyle=`rgba(255,255,255,${.045+.055*q})`;X.lineWidth=.65;X.beginPath();X.moveTo(A.x,A.y);X.lineTo(B.x,B.y);X.stroke();let u=(t*.16+(B.x+B.y)*.00035)%1;X.fillStyle=`rgba(255,255,255,${.16+.16*q})`;X.beginPath();X.arc(A.x+(B.x-A.x)*u,A.y+(B.y-A.y)*u,1.05,0,7);X.fill()}N.forEach((n,i)=>{let a=pos(n),breath=1+Math.sin(t*.9*n.depth+n.phase)*.22,hover=Math.hypot(m.x-a.x,m.y-a.y)<34,sel=selected===n.id,scale=breath*(sel?2.15:hover?1.38:1),r=n.r*scale;hit.push({n,x:a.x,y:a.y,r:Math.max(18,r*2.3)});let glow=X.createRadialGradient(a.x,a.y,0,a.x,a.y,r*(sel?9:6));glow.addColorStop(0,sel?'rgba(255,255,255,.30)':'rgba(255,255,255,.14)');glow.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=glow;X.beginPath();X.arc(a.x,a.y,r*(sel?9:6),0,7);X.fill();if(sel){X.strokeStyle='rgba(255,255,255,.30)';X.lineWidth=.8;X.beginPath();X.arc(a.x,a.y,r*2.25+Math.sin(t*2)*3,0,7);X.stroke();X.strokeStyle='rgba(255,255,255,.10)';X.beginPath();X.arc(a.x,a.y,r*3.4+Math.cos(t*1.4)*5,0,7);X.stroke()}X.fillStyle=n.g==='pros'?'#fff':'#d8d9d4';X.beginPath();X.arc(a.x,a.y,r,0,7);X.fill();let always=['LEON','BRAVA','THINK','GALA','ACTIVOS','MURALES','CUERPO','MENTE','ESP'].includes(n.id);if(always||hover||sel||W>900){X.font=(sel?'600 12px':'10px')+' -apple-system,Arial';X.fillStyle=sel?'rgba(255,255,255,.98)':'rgba(235,235,230,.70)';X.fillText(n.label,a.x+r+8,a.y+3)}});requestAnimationFrame(draw)}draw();
const card=document.getElementById('nodecard'),cardTitle=document.getElementById('cardTitle'),cardText=document.getElementById('cardText');function openNode(h){selected=h.n.id;cardTitle.textContent=h.n.label;let children=N.filter(n=>n.p===h.n.id).length;cardText.textContent=children?children+' conexiones activas. Toca de nuevo para cerrar.':'Nodo activo. Aquí podremos mostrar notas, dinero, progreso y siguientes acciones.';card.style.left=h.x+'px';card.style.top=Math.max(140,h.y-58)+'px';card.classList.add('open')}C.addEventListener('pointerdown',e=>{let h=[...hit].reverse().find(o=>Math.hypot(e.clientX-o.x,e.clientY-o.y)<o.r);if(!h){selected=null;card.classList.remove('open');return}if(selected===h.n.id){selected=null;card.classList.remove('open')}else openNode(h)});
const rules=[['MURALES','Murales / THORO Art',['mural','murales','muro','pared']],['THOROFOTO','THORO Calavera Foto',['foto','fotografía','fotografia','sesión','sesion']],['THINK','THINK',['mareli','think','bee tierra','amasa','universidad panamericana',' up ']],['GALA','GALA × BRAVA',['gala','ainsa','interni']],['BRAVA','BRAVA',['menú digital','menu digital','redes sociales','contenido','sitio web','página web','pagina web','nfc','google reviews','branding','brava']],['BLACK','Black Royal',['black royal','roulette','ruleta','apuestas','deportivo']],['BRUSHES','Brushes',['brush','brushes','pinceles']],['QUIZ','Quiz',['quiz','test','cuestionario']],['HYROX','Cuerpo / HYROX',['hyrox','correr','corrí','corri','entrené','entrene','ejercicio','gym','gimnasio']],['NUTRI','Nutrición',['comí','comi','alimentación','alimentacion','nutrición','nutricion']],['LIBROS','Mente / Libros',['libro','leí','lei','lectura','capítulo','capitulo']],['MEDITA','Espíritu / Meditación',['medité','medite','meditación','meditacion']]];
function classify(s){s=' '+s.toLowerCase()+' ';let best=null;for(const[r,l,ws]of rules){let score=ws.reduce((a,w)=>a+(s.includes(w)?1:0),0);if(score&&(!best||score>best.score))best={id:r,label:l,score}}return best||{id:'LEON',label:'LEÓN / Inbox'}}function amount(s){let m=s.match(/\$?\s?(\d{1,3}(?:[.,]\d{3})+|\d{3,6})(?:\s?(?:pesos|mxn))?/i);return m?m[1].replace(/[.,](?=\d{3}\b)/g,''):null}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const note=document.getElementById('note'),route=document.getElementById('route'),events=document.getElementById('events');function render(){let a=JSON.parse(localStorage.getItem('leonlife')||'[]');events.innerHTML=a.slice().reverse().map(e=>`<div class="ev"><div class="t">${esc(e.text)}</div><div class="s">${esc(e.route)}${e.amount?' · $'+e.amount:''} · ${new Date(e.date).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="ev"><div class="s">Aún no hay movimientos.</div></div>'}render();
function add(text,target){let q=node(target)||node('LEON'),ang=Math.random()*6.28,rr=.08+Math.random()*.05,id='E'+Date.now();N.push({id,label:text.length>32?text.slice(0,29)+'…':text,x:Math.max(.06,Math.min(.94,q.x+Math.cos(ang)*rr)),y:Math.max(.06,Math.min(.88,q.y+Math.sin(ang)*rr)),r:2.3,g:'pros',p:q.id,phase:Math.random()*6.28,amp:.008+Math.random()*.01,speed:.25+Math.random()*.2,depth:.8+Math.random()*.4});L.push([q.id,id])}
function save(){let text=note.value.trim();if(!text)return;let c=classify(text),am=amount(text),a=JSON.parse(localStorage.getItem('leonlife')||'[]');a.push({text,route:c.label,amount:am,date:new Date().toISOString()});localStorage.setItem('leonlife',JSON.stringify(a.slice(-250)));add(text,c.id);route.textContent='→ '+c.label+(am?' · $'+am:'');note.value='';document.getElementById('hint').style.display='none';render()}document.getElementById('send').onclick=save;note.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')save()});document.getElementById('logBtn').onclick=()=>document.getElementById('drawer').classList.toggle('open');
const mic=document.getElementById('mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.lang='es-MX';r.interimResults=true;r.onstart=()=>{mic.classList.add('on');route.textContent='Escuchando…'};r.onend=()=>{mic.classList.remove('on');route.textContent='Dictado listo. Revisa y guarda.'};r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;note.value=s};mic.onclick=()=>{try{r.start()}catch(e){}}}else{mic.onclick=()=>alert('Usa el micrófono del teclado en iPhone/iPad.');}
</script>
</body>
</html>
