<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NEURAL KIT — Personal Intelligence System</title>
<style>
:root{--fg:#f4f2eb;--mut:#8c8f93}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#0b0d12 0,#050608 34%,#020304 72%,#000 100%);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:5;left:18px;right:18px;top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;pointer-events:none}.k{font-size:10px;letter-spacing:.23em;color:var(--mut);text-transform:uppercase}.title{font-size:18px;margin-top:6px}.goal{text-align:right;font-size:11px}.goal span{display:block;color:var(--mut);margin-top:4px}.chips{position:fixed;z-index:5;left:18px;top:86px;display:flex;gap:6px;flex-wrap:wrap;max-width:80vw}.chip{padding:6px 8px;border:1px solid rgba(255,255,255,.07);border-radius:999px;font-size:9px;color:#b9bab6;background:rgba(0,0,0,.18);backdrop-filter:blur(10px)}.navhint{position:fixed;z-index:4;left:50%;top:112px;transform:translateX(-50%);font-size:9px;color:rgba(255,255,255,.38);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;white-space:nowrap}.composerWrap{position:fixed;z-index:9;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center}.composer{width:min(760px,100%);border:1px solid rgba(255,255,255,.09);background:rgba(10,11,14,.82);backdrop-filter:blur(24px);border-radius:22px;padding:10px;box-shadow:0 28px 110px rgba(0,0,0,.66)}.row{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:56px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;line-height:1.4;padding:12px}textarea::placeholder{color:#666a6f}.mic,.send{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center}.mic{background:#17191d;color:#fff;border:1px solid rgba(255,255,255,.08)}.mic.on{background:#efede6;color:#060606}.send{background:#efede6;color:#060606}.meta{display:flex;justify-content:space-between;padding:4px 8px 1px;color:var(--mut);font-size:10px}.logbtn{position:fixed;z-index:10;right:18px;top:82px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#d8d8d3;border-radius:999px;padding:7px 10px;font-size:9px}.drawer{position:fixed;z-index:12;right:14px;top:124px;width:min(330px,calc(100vw - 28px));max-height:54vh;overflow:auto;padding:12px;border:1px solid rgba(255,255,255,.08);background:rgba(8,9,12,.90);backdrop-filter:blur(24px);border-radius:18px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.2s}.drawer.open{opacity:1;transform:none;pointer-events:auto}.ev{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}.ev .t{font-size:12px;line-height:1.35}.ev .s{margin-top:5px;color:var(--mut);font-size:9px;text-transform:uppercase}.nodecard{position:fixed;z-index:8;min-width:190px;max-width:260px;padding:12px 14px;border:1px solid rgba(255,255,255,.12);background:rgba(8,10,14,.78);backdrop-filter:blur(22px);border-radius:16px;box-shadow:0 18px 70px rgba(0,0,0,.55);opacity:0;transform:translate(-50%,-50%) scale(.93);pointer-events:none;transition:.18s}.nodecard.open{opacity:1;transform:translate(-50%,-50%) scale(1)}.nodecard b{font-size:12px}.nodecard span{display:block;font-size:9px;color:var(--mut);margin-top:5px;line-height:1.45}@media(max-width:620px){.goal{display:none}.logbtn{top:48px}.drawer{top:86px}.chips{top:83px;max-width:92vw}.navhint{top:126px;font-size:8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div><div class="k">Personal Intelligence System</div><div class="title">NEURAL KIT</div></div><div class="goal"><b>$500K / 100 DÍAS</b><span>medir avance, no actividad</span></div></div>
<div class="chips"><span class="chip">VENTAS</span><span class="chip">BRAVA</span><span class="chip">THINK</span><span class="chip">GALA × BRAVA</span><span class="chip">ACTIVOS</span><span class="chip">CUERPO</span><span class="chip">MENTE</span><span class="chip">ESPÍRITU</span></div>
<div class="navhint">1 dedo: orbitar · 2 dedos: viajar, mover y zoom</div>
<button id="logBtn" class="logbtn">REGISTRO</button><aside id="drawer" class="drawer"><h2>Últimos movimientos</h2><div id="events"></div></aside>
<div id="nodecard" class="nodecard"><b id="cardTitle"></b><span id="cardText"></span></div>
<div class="composerWrap"><div class="composer"><div class="row"><button id="mic" class="mic">◉</button><textarea id="note" placeholder="¿Qué pasó hoy? Ej. ‘Ainsa cerró web + ajuste de imagen por 5,000 pesos…’"></textarea><button id="send" class="send">→</button></div><div class="meta"><span id="route">Listo para capturar.</span><span>MVP LOCAL</span></div></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1,t=0,rot=0,tilt=.12,zoom=1,camZ=0,panX=0,panY=0,selected=null,hit=[],m={x:W/2,y:H/2};
const raw=[['LEON','LEÓN',0,9,'core'],['CUERPO','CUERPO',1,6,'pers','LEON'],['HYROX','HYROX Cancún',2,3,'pers','CUERPO'],['NUTRI','Nutrición',3,2.6,'pers','CUERPO'],['MENTE','MENTE',4,5,'pers','LEON'],['LIBROS','Libros',5,2.6,'pers','MENTE'],['ESP','ESPÍRITU',6,5,'pers','LEON'],['MEDITA','Meditación',7,2.6,'pers','ESP'],['BRAVA','BRAVA',8,6,'biz','LEON'],['MAGBAY','Magbay Seafaris',9,3,'biz','BRAVA'],['MEXWORK','Mexwork',10,3,'biz','BRAVA'],['SABINO','Sabino y Villagómez',11,3,'biz','BRAVA'],['BARBA','Barba Azul',12,3,'biz','BRAVA'],['TILIA','Tilia Café · prospecto',13,3,'pros','BRAVA'],['THINK','THINK',14,6,'biz','LEON'],['UP','UP',15,3,'biz','THINK'],['BEE','Bee Tierra · prospecto',16,3,'pros','THINK'],['AMASA','Amasa · prospecto',17,3,'pros','THINK'],['GALA','GALA × BRAVA',18,5,'biz','LEON'],['AINSA','Ainsa',19,3.2,'biz','GALA'],['ACTIVOS','ACTIVOS',20,6,'pers','LEON'],['BLACK','Black Royal',21,4,'pers','ACTIVOS'],['ROULETTE','Roulette',22,2.5,'pers','BLACK'],['DEPORTIVO','Deportivo',23,2.5,'pers','BLACK'],['QUIZ','Quiz',24,3,'pers','ACTIVOS'],['BRUSHES','Brushes',25,3,'pers','ACTIVOS'],['MURALES','MURALES',26,6,'pers','LEON'],['THOROART','THORO Calavera Art',27,3,'pers','MURALES'],['THOROFOTO','THORO Calavera Foto',28,3,'pers','MURALES']];
const N=raw.map((a,i)=>({id:a[0],label:a[1],order:a[2],r:a[3],g:a[4],p:a[5],phase:i*.61,breath:.8+Math.random()*.5,offset:(Math.random()-.5)*.26}));let L=N.filter(n=>n.p).map(n=>[n.p,n.id]);function node(id){return N.find(n=>n.id===id)}
const stars=Array.from({length:170},()=>({x:Math.random(),y:Math.random(),z:Math.random(),s:.25+Math.random()*1.4,tw:Math.random()*6.28}));function rs(){W=innerWidth;H=innerHeight;D=devicePixelRatio||1;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);
function world(n){if(n.id==='LEON')return{x:0,y:0,z:20};let i=n.order,a=i*.63+rot+t*.026,r=78+i*8.8,y=(i-14)*12.5;return{x:Math.cos(a)*r,y:y+Math.sin(a*.55+n.phase)*13+Math.sin(t*.22+n.phase)*7,z:Math.sin(a)*r+n.offset*70}}
function project(v){let cy=Math.cos(tilt),sy=Math.sin(tilt),yy=v.y*cy-v.z*sy,zz=v.y*sy+v.z*cy-camZ,cam=700/zoom,den=Math.max(95,cam+zz+210),s=cam/den;return{x:W/2+panX+v.x*s,y:H*.46+panY+yy*s,z:zz,scale:s,alpha:Math.max(.10,Math.min(1,.26+s*.78))}}
function starfield(){for(const s of stars){let par=(camZ*.00018*s.z)+(panX*.00003*s.z),x=((s.x+t*.00035+par)%1)*W,y=((s.y+panY*.00002*s.z)%1)*H,a=.09+s.z*.34+Math.sin(t*.9+s.tw)*.07;X.fillStyle=`rgba(255,255,255,${a})`;X.beginPath();X.arc(x,y,s.s*(.5+s.z)*zoom*.45,0,7);X.fill()}}
function draw(){t+=.012;X.clearRect(0,0,W,H);starfield();hit=[];let pts=new Map(N.map(n=>[n.id,project(world(n))]));for(const[a,b]of L){let A=pts.get(a),B=pts.get(b),depth=(A.scale+B.scale)/2;X.strokeStyle=`rgba(205,220,255,${.025+.08*Math.min(1.4,depth)})`;X.lineWidth=.45+.55*Math.min(1.3,depth);X.beginPath();X.moveTo(A.x,A.y);let cx=(A.x+B.x)/2+(A.y-B.y)*.035,cy=(A.y+B.y)/2+(B.x-A.x)*.035;X.quadraticCurveTo(cx,cy,B.x,B.y);X.stroke()}
for(const n of [...N].sort((a,b)=>pts.get(a.id).z-pts.get(b.id).z)){let p=pts.get(n.id),hover=Math.hypot(m.x-p.x,m.y-p.y)<30,sel=selected===n.id,breath=1+Math.sin(t*n.breath+n.phase)*.12,sc=p.scale*breath*(sel?2:hover?1.28:1),r=Math.max(1.3,n.r*sc);hit.push({n,x:p.x,y:p.y,r:Math.max(18,r*2.2),z:p.z});let g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,r*(sel?10:7));g.addColorStop(0,sel?'rgba(200,220,255,.34)':`rgba(210,225,255,${.12*p.alpha})`);g.addColorStop(1,'rgba(150,190,255,0)');X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,r*(sel?10:7),0,7);X.fill();if(sel){X.strokeStyle='rgba(210,230,255,.38)';X.beginPath();X.arc(p.x,p.y,r*2.6+Math.sin(t*2)*3,0,7);X.stroke()}X.globalAlpha=p.alpha;X.fillStyle=n.g==='pros'?'#fff':'#d8e2ee';X.beginPath();X.arc(p.x,p.y,r,0,7);X.fill();X.globalAlpha=1;let major=['LEON','BRAVA','THINK','GALA','ACTIVOS','MURALES','CUERPO','MENTE','ESP'].includes(n.id);if(major||hover||sel||W>1000){X.font=(sel?'600 12px':'10px')+' -apple-system,Arial';X.fillStyle=sel?'#fff':`rgba(230,235,240,${.38+.5*p.alpha})`;X.fillText(n.label,p.x+r+8,p.y+3)}}requestAnimationFrame(draw)}draw();
const card=document.getElementById('nodecard'),cardTitle=document.getElementById('cardTitle'),cardText=document.getElementById('cardText');function openNode(h){selected=h.n.id;cardTitle.textContent=h.n.label;let a=JSON.parse(localStorage.getItem('leonlife')||'[]').filter(e=>e.target===h.n.id),total=a.reduce((s,e)=>s+(+e.amount||0),0),children=N.filter(n=>n.p===h.n.id).length;cardText.textContent=(children?children+' conexiones · ':'')+(a.length?a.length+' movimientos'+(total?' · $'+total.toLocaleString('es-MX')+' MXN':''):'sin movimientos registrados todavía');card.style.left=Math.min(W-145,Math.max(145,h.x))+'px';card.style.top=Math.min(H-170,Math.max(155,h.y-62))+'px';card.classList.add('open')}
const pts=new Map();let gesture=null,singleStart=null;function arr(){return [...pts.values()]}
C.addEventListener('pointerdown',e=>{C.setPointerCapture?.(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});m={x:e.clientX,y:e.clientY};if(pts.size===1){singleStart={x:e.clientX,y:e.clientY,rot,tilt,time:performance.now()};gesture=null}else if(pts.size===2){let a=arr(),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);gesture={d,cx,cy,zoom,camZ,panX,panY};singleStart=null}});
C.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});m={x:e.clientX,y:e.clientY};if(pts.size===1&&singleStart){rot=singleStart.rot+(e.clientX-singleStart.x)*.006;tilt=Math.max(-.82,Math.min(.82,singleStart.tilt+(e.clientY-singleStart.y)*.003))}else if(pts.size===2){let a=arr(),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,d=Math.max(20,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));if(!gesture)gesture={d,cx,cy,zoom,camZ,panX,panY};let ratio=d/gesture.d;zoom=Math.max(.45,Math.min(3.2,gesture.zoom*ratio));panX=Math.max(-W*.8,Math.min(W*.8,gesture.panX+(cx-gesture.cx)*1.1));panY=Math.max(-H*.8,Math.min(H*.8,gesture.panY+(cy-gesture.cy)*1.1));camZ=Math.max(-650,Math.min(1200,gesture.camZ+(gesture.cy-cy)*2.2+(ratio-1)*420))}});
function endPointer(e){let wasSingle=pts.size===1&&singleStart,st=singleStart;pts.delete(e.pointerId);if(wasSingle&&st){let moved=Math.hypot(e.clientX-st.x,e.clientY-st.y);if(moved<10&&performance.now()-st.time<350){let h=[...hit].sort((a,b)=>b.z-a.z).find(o=>Math.hypot(e.clientX-o.x,e.clientY-o.y)<o.r);if(h)openNode(h);else{selected=null;card.classList.remove('open')}}}if(pts.size===1){let q=arr()[0];singleStart={x:q.x,y:q.y,rot,tilt,time:performance.now()}}else if(pts.size===0){singleStart=null;gesture=null}}
C.addEventListener('pointerup',endPointer);C.addEventListener('pointercancel',endPointer);C.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.45,Math.min(3.2,zoom*Math.exp(-e.deltaY*.001)));camZ=Math.max(-650,Math.min(1200,camZ-e.deltaY*.55))},{passive:false});
const rules=[['AINSA','GALA × BRAVA / Ainsa',['ainsa']],['MURALES','Murales / THORO Art',['mural','murales']],['THINK','THINK',['mareli','think','bee tierra','amasa',' up ']],['GALA','GALA × BRAVA',['gala','interni']],['BRAVA','BRAVA',['menú digital','menu digital','sitio web','página web','pagina web','nfc','branding','brava']],['BLACK','Black Royal',['black royal','roulette','ruleta']],['HYROX','Cuerpo / HYROX',['hyrox','entrené','ejercicio','gym']],['NUTRI','Nutrición',['comí','nutrición']],['LIBROS','Mente / Libros',['libro','leí','lectura']],['MEDITA','Espíritu / Meditación',['medité','meditación']]];function classify(s){s=' '+s.toLowerCase()+' ';let best=null;for(const[r,l,ws]of rules){let score=ws.reduce((a,w)=>a+(s.includes(w)?1:0),0);if(score&&(!best||score>best.score))best={id:r,label:l,score}}return best||{id:'LEON',label:'LEÓN / Inbox'}}function amount(s){let m=s.match(/\$?\s?(\d{1,3}(?:[.,]\d{3})+|\d{3,6})(?:\s?(?:pesos|mxn))?/i);return m?m[1].replace(/[.,](?=\d{3}\b)/g,''):null}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const note=document.getElementById('note'),route=document.getElementById('route'),events=document.getElementById('events');function render(){let a=JSON.parse(localStorage.getItem('leonlife')||'[]');events.innerHTML=a.slice().reverse().map(e=>`<div class="ev"><div class="t">${esc(e.text)}</div><div class="s">${esc(e.route)}${e.amount?' · $'+e.amount:''} · ${new Date(e.date).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="ev"><div class="s">Aún no hay movimientos.</div></div>'}render();function save(){let text=note.value.trim();if(!text)return;let c=classify(text),am=amount(text),a=JSON.parse(localStorage.getItem('leonlife')||'[]');a.push({text,route:c.label,target:c.id,amount:am,date:new Date().toISOString()});localStorage.setItem('leonlife',JSON.stringify(a.slice(-250)));route.textContent='→ '+c.label+(am?' · $'+am:'');note.value='';render()}document.getElementById('send').onclick=save;document.getElementById('logBtn').onclick=()=>document.getElementById('drawer').classList.toggle('open');
const mic=document.getElementById('mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.lang='es-MX';r.interimResults=true;r.onstart=()=>{mic.classList.add('on');route.textContent='Escuchando…'};r.onend=()=>{mic.classList.remove('on');route.textContent='Dictado listo. Revisa y guarda.'};r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;note.value=s};mic.onclick=()=>{try{r.start()}catch(e){}}}else mic.onclick=()=>alert('Usa el micrófono del teclado en iPhone/iPad.');
</script>
</body>
</html>
