<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NEURAL KIT — Personal Intelligence System</title>
<style>
:root{--bg:#070707;--fg:#f4f2eb;--mut:#8b8c87;--line:rgba(255,255,255,.10)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:4;left:18px;right:18px;top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;pointer-events:none}.k{font-size:10px;letter-spacing:.23em;color:var(--mut);text-transform:uppercase}.title{font-size:18px;margin-top:6px;letter-spacing:-.03em}.goal{text-align:right;font-size:11px}.goal span{display:block;color:var(--mut);margin-top:4px}.chips{position:fixed;z-index:4;left:18px;top:86px;display:flex;gap:6px;flex-wrap:wrap;max-width:80vw}.chip{padding:6px 8px;border:1px solid rgba(255,255,255,.07);border-radius:999px;font-size:9px;color:#b9bab6;background:rgba(0,0,0,.22);backdrop-filter:blur(10px)}.composerWrap{position:fixed;z-index:7;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center}.composer{width:min(760px,100%);border:1px solid rgba(255,255,255,.09);background:rgba(14,14,14,.86);backdrop-filter:blur(22px);border-radius:22px;padding:10px;box-shadow:0 22px 90px rgba(0,0,0,.55)}.row{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:56px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;line-height:1.4;padding:12px}textarea::placeholder{color:#666864}.mic,.send{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}.mic{background:#191919;color:#fff;border:1px solid rgba(255,255,255,.08)}.mic.on{background:#efede6;color:#060606;box-shadow:0 0 0 7px rgba(255,255,255,.05)}.send{background:#efede6;color:#060606}.meta{display:flex;justify-content:space-between;gap:10px;padding:4px 8px 1px;color:var(--mut);font-size:10px}.logbtn{position:fixed;z-index:8;right:18px;top:82px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#d8d8d3;border-radius:999px;padding:7px 10px;font-size:9px}.drawer{position:fixed;z-index:9;right:14px;top:124px;width:min(330px,calc(100vw - 28px));max-height:54vh;overflow:auto;padding:12px;border:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.88);backdrop-filter:blur(22px);border-radius:18px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.2s}.drawer.open{opacity:1;transform:none;pointer-events:auto}.drawer h2{font-size:10px;letter-spacing:.17em;color:var(--mut);font-weight:500;text-transform:uppercase}.ev{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}.ev .t{font-size:12px;line-height:1.35}.ev .s{margin-top:5px;color:var(--mut);font-size:9px;text-transform:uppercase;letter-spacing:.07em}.centerHint{position:fixed;z-index:2;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:.48}.centerHint b{display:block;font-weight:500;font-size:12px}.centerHint span{font-size:10px;color:var(--mut)}@media(max-width:620px){.goal{display:none}.logbtn{top:48px}.drawer{top:86px}.chips{top:83px;max-width:92vw}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div><div class="k">Personal Intelligence System</div><div class="title">NEURAL KIT</div></div><div class="goal"><b>$500K / 100 DÍAS</b><span>medir avance, no actividad</span></div></div>
<div class="chips"><span class="chip">VENTAS</span><span class="chip">BRAVA</span><span class="chip">THINK</span><span class="chip">GALA × BRAVA</span><span class="chip">ACTIVOS</span><span class="chip">CUERPO</span><span class="chip">MENTE</span><span class="chip">ESPÍRITU</span></div>
<button id="logBtn" class="logbtn">REGISTRO</button><aside id="drawer" class="drawer"><h2>Últimos movimientos</h2><div id="events"></div></aside>
<div id="hint" class="centerHint"><b>Tu sistema empieza contigo.</b><span>Habla o escribe. La red se reorganiza.</span></div>
<div class="composerWrap"><div class="composer"><div class="row"><button id="mic" class="mic" aria-label="Dictar">◉</button><textarea id="note" placeholder="¿Qué pasó hoy? Ej. ‘Visité a un cliente para ofrecer murales y le interesó…’"></textarea><button id="send" class="send" aria-label="Guardar">→</button></div><div class="meta"><span id="route">Listo para capturar.</span><span>MVP LOCAL</span></div></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1,t=0,m={x:W/2,y:H/2};
const N=[
['LEON','LEÓN','.50','.45',7,'core'],['BRAVA','BRAVA','.30','.34',5,'biz','LEON'],['THINK','THINK','.69','.34',5,'biz','LEON'],['GALA','GALA × BRAVA','.72','.53',4,'biz','LEON'],
['MAGBAY','Magbay Seafaris','.16','.25',3,'biz','BRAVA'],['MEXWORK','Mexwork','.16','.38',3,'biz','BRAVA'],['SABINO','Sabino y Villagómez','.23','.49',3,'biz','BRAVA'],['BARBA','Barba Azul','.36','.52',3,'biz','BRAVA'],['TILIA','Tilia Café · prospecto','.09','.49',3,'pros','BRAVA'],
['UP','UP','.82','.24',3,'biz','THINK'],['BEE','Bee Tierra · prospecto','.86','.37',3,'pros','THINK'],['AMASA','Amasa · prospecto','.82','.46',3,'pros','THINK'],['AINSA','Ainsa','.86','.59',3,'biz','GALA'],
['ACTIVOS','ACTIVOS','.34','.68',5,'pers','LEON'],['BLACK','Black Royal','.18','.70',4,'pers','ACTIVOS'],['ROULETTE','Roulette','.08','.78',2.5,'pers','BLACK'],['DEPORTIVO','Deportivo','.20','.83',2.5,'pers','BLACK'],['QUIZ','Quiz','.35','.83',3,'pers','ACTIVOS'],['BRUSHES','Brushes','.46','.79',3,'pers','ACTIVOS'],
['MURALES','MURALES','.60','.72',5,'pers','LEON'],['THOROART','THORO Calavera Art','.70','.82',3,'pers','MURALES'],['THOROFOTO','THORO Calavera Foto','.82','.73',3,'pers','MURALES'],
['CUERPO','CUERPO','.49','.17',4,'pers','LEON'],['HYROX','HYROX Cancún','.59','.08',3,'pers','CUERPO'],['NUTRI','Nutrición','.42','.07',2.6,'pers','CUERPO'],['MENTE','MENTE','.30','.12',4,'pers','LEON'],['LIBROS','Libros','.18','.11',2.6,'pers','MENTE'],['ESP','ESPÍRITU','.69','.13',4,'pers','LEON'],['MEDITA','Meditación','.80','.10',2.6,'pers','ESP']
].map(a=>({id:a[0],label:a[1],x:+a[2],y:+a[3],r:+a[4],g:a[5],p:a[6]}));let L=N.filter(n=>n.p).map(n=>[n.p,n.id]);
function node(id){return N.find(n=>n.id===id)}function P(n){return{x:n.x*W,y:n.y*H}}function rs(){W=innerWidth;H=innerHeight;D=devicePixelRatio||1;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);addEventListener('pointermove',e=>m={x:e.clientX,y:e.clientY});
function draw(){t+=.008;X.clearRect(0,0,W,H);for(const[a,b]of L){let A=P(node(a)),B=P(node(b)),q=(Math.sin(t*2+B.x*.01)+1)/2;X.strokeStyle=`rgba(255,255,255,${.06+.05*q})`;X.lineWidth=.7;X.beginPath();X.moveTo(A.x,A.y);X.lineTo(B.x,B.y);X.stroke();let u=(t*.35+(B.x+B.y)*.0008)%1;X.fillStyle=`rgba(255,255,255,${.18+.15*q})`;X.beginPath();X.arc(A.x+(B.x-A.x)*u,A.y+(B.y-A.y)*u,1.1,0,7);X.fill()}N.forEach((n,i)=>{let a=P(n),x=a.x+Math.sin(t*1.2+i)*2.4,y=a.y+Math.cos(t+i*.7)*2.4,d=Math.hypot(m.x-x,m.y-y),h=d<70,r=n.r+h*1.3;let g=X.createRadialGradient(x,y,0,x,y,r*5);g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=g;X.beginPath();X.arc(x,y,r*5,0,7);X.fill();X.fillStyle=n.g==='pros'?'#fff':'#d8d9d4';X.beginPath();X.arc(x,y,r,0,7);X.fill();if(['LEON','BRAVA','THINK','GALA','ACTIVOS','MURALES','CUERPO','MENTE','ESP'].includes(n.id)||h||W>900){X.font='10px -apple-system,Arial';X.fillStyle='rgba(235,235,230,.70)';X.fillText(n.label,x+r+7,y+3)}});requestAnimationFrame(draw)}draw();
const rules=[['MURALES','Murales / THORO Art',['mural','murales','muro','pared']],['THOROFOTO','THORO Calavera Foto',['foto','fotografía','fotografia','sesión','sesion']],['THINK','THINK',['mareli','think','bee tierra','amasa','universidad panamericana',' up ']],['GALA','GALA × BRAVA',['gala','ainsa','interni']],['BRAVA','BRAVA',['menú digital','menu digital','redes sociales','contenido','sitio web','página web','pagina web','nfc','google reviews','branding','brava']],['BLACK','Black Royal',['black royal','roulette','ruleta','apuestas','deportivo']],['BRUSHES','Brushes',['brush','brushes','pinceles']],['QUIZ','Quiz',['quiz','test','cuestionario']],['HYROX','Cuerpo / HYROX',['hyrox','correr','corrí','corri','entrené','entrene','ejercicio','gym','gimnasio']],['NUTRI','Nutrición',['comí','comi','alimentación','alimentacion','nutrición','nutricion']],['LIBROS','Mente / Libros',['libro','leí','lei','lectura','capítulo','capitulo']],['MEDITA','Espíritu / Meditación',['medité','medite','meditación','meditacion']]];
function classify(s){s=' '+s.toLowerCase()+' ';let best=null;for(const[r,l,ws]of rules){let score=ws.reduce((a,w)=>a+(s.includes(w)?1:0),0);if(score&&(!best||score>best.score))best={id:r,label:l,score}}return best||{id:'LEON',label:'LEÓN / Inbox'}}function amount(s){let m=s.match(/\$?\s?(\d{1,3}(?:[.,]\d{3})+|\d{3,6})(?:\s?(?:pesos|mxn))?/i);return m?m[1].replace(/[.,](?=\d{3}\b)/g,''):null}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const note=document.getElementById('note'),route=document.getElementById('route'),events=document.getElementById('events');function render(){let a=JSON.parse(localStorage.getItem('leonlife')||'[]');events.innerHTML=a.slice().reverse().map(e=>`<div class="ev"><div class="t">${esc(e.text)}</div><div class="s">${esc(e.route)}${e.amount?' · $'+e.amount:''} · ${new Date(e.date).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="ev"><div class="s">Aún no hay movimientos.</div></div>'}render();
function add(text,target){let q=node(target)||node('LEON'),ang=Math.random()*6.28,rr=.08+Math.random()*.05,id='E'+Date.now();N.push({id,label:text.length>32?text.slice(0,29)+'…':text,x:Math.max(.06,Math.min(.94,q.x+Math.cos(ang)*rr)),y:Math.max(.06,Math.min(.88,q.y+Math.sin(ang)*rr)),r:2.3,g:'pros',p:q.id});L.push([q.id,id])}
function save(){let text=note.value.trim();if(!text)return;let c=classify(text),am=amount(text),a=JSON.parse(localStorage.getItem('leonlife')||'[]');a.push({text,route:c.label,amount:am,date:new Date().toISOString()});localStorage.setItem('leonlife',JSON.stringify(a.slice(-250)));add(text,c.id);route.textContent='→ '+c.label+(am?' · $'+am:'');note.value='';document.getElementById('hint').style.display='none';render()}document.getElementById('send').onclick=save;note.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')save()});document.getElementById('logBtn').onclick=()=>document.getElementById('drawer').classList.toggle('open');
const mic=document.getElementById('mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.lang='es-MX';r.interimResults=true;r.onstart=()=>{mic.classList.add('on');route.textContent='Escuchando…'};r.onend=()=>{mic.classList.remove('on');route.textContent='Dictado listo. Revisa y guarda.'};r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;note.value=s};mic.onclick=()=>{try{r.start()}catch(e){}}}else{mic.onclick=()=>alert('Usa el micrófono del teclado en iPhone/iPad.');}
</script>
</body>
</html>
